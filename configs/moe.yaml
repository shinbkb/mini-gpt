# Target settings from the plan; MoE implementation starts at M4.
seed: 42
model:
  type: moe
  model_type: moe
  n_layers: 6
  d_model: 384
  n_heads: 6
  head_dim: 64
  d_ff: 1536
  vocab_size: 8000
  block_size: 512
  dropout: 0.1
  n_experts: 4
  top_k: 2
  auxiliary_loss_coefficient: 0.01
training:
  optimizer: AdamW
  learning_rate: 0.0003
  batch_size: 8
  precision: fp16  # GPU target; CPU smoke tests use float32.
  weight_decay: 0.1
  gradient_clip: 1.0
  warmup_steps: 100
  min_lr_ratio: 0.1
  max_steps: 1000
  eval_interval: 100
  eval_batches: 20
  gradient_accumulation_steps: 1
  output_dir: runs/moe
data:
  train_tokens: artifacts/train_tokens.pt
  validation_tokens: artifacts/validation_tokens.pt
